name: Update Predictions

on:
  # --- Scheduled cron সাময়িকভাবে বন্ধ করে দেওয়া হলো (ইউজারের অনুরোধে) ---
  # আগে এই দুইটা cron ছিল:
  #   - cron: "0 23 * * *"   # BD সকাল ৫টা — শুধু result check
  #   - cron: "0 0 * * *"    # BD সকাল ৬টা — শুধু নতুন top-5 predictions
  # আবার চালু করতে চাইলে schedule: ব্লক এবং নিচের দুইটা cron লাইন আনকমেন্ট করুন।
  #
  # schedule:
  #   - cron: "0 23 * * *"
  #   - cron: "0 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      # schedule বন্ধ থাকায় এখন শুধু workflow_dispatch (ম্যানুয়াল রান) দিয়েই চলবে,
      # এবং তখন দুইটা স্টেপই (generate + check) একসাথে চলবে
      - name: Generate today's top-5 predictions
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 0 * * *'
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_ORG_TOKEN: ${{ secrets.FOOTBALL_DATA_ORG_TOKEN }}
        run: python scripts/generate_predictions.py

      - name: Check results and update history.json
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 23 * * *'
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_ORG_TOKEN: ${{ secrets.FOOTBALL_DATA_ORG_TOKEN }}
        run: python scripts/check_results.py

      - name: Commit updated data
        run: |
          git config user.name "predictions-bot"
          git config user.email "actions@github.com"
          git add data/predictions.json data/predictions_log.json data/history.json
          git diff --staged --quiet || git commit -m "Update predictions/results [auto]"
          git push
