name: Update Predictions

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Generate predictions.json
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python scripts/generate_predictions.py

      - name: Commit updated data
        run: |
          git config user.name "predictions-bot"
          git config user.email "actions@github.com"
          git add data/predictions.json
          git diff --staged --quiet || git commit -m "Update predictions [auto]"
          git push
